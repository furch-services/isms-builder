name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          STORAGE_BACKEND: json

      - name: Verify pinned dependencies
        run: |
          # pdf-parse muss exakt 1.1.1 sein — v2 hat inkompatible API (siehe PINNED-DEPS.md)
          INSTALLED=$(node -e "console.log(require('./node_modules/pdf-parse/package.json').version)")
          if [ "$INSTALLED" != "1.1.1" ]; then
            echo "::error::pdf-parse ist auf Version $INSTALLED — muss exakt 1.1.1 sein! Siehe PINNED-DEPS.md"
            exit 1
          fi
          echo "✓ pdf-parse $INSTALLED (korrekt gepinnt)"

      - name: Security audit (critical + high — hard fail)
        run: npm audit --audit-level=high

      - name: Security audit (moderate — informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || true

  test-sqlite:
    name: Test (SQLite backend, #42 bootstrap gate)
    runs-on: ubuntu-latest
    # Eigener, schlanker Job statt Teil der Matrix: die Suite ist ganz
    # überwiegend backend-neutral, jede Testdatei setzt STORAGE_BACKEND=json
    # selbst und würde einen Matrix-Wert wieder überschreiben. Dieser Job
    # deckt gezielt den Knex/SQLite-Bootstrap-Pfad ab (tests/dbBootstrapSqlite.test.js).

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SQLite bootstrap tests
        run: npx jest tests/dbBootstrapSqlite.test.js --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          STORAGE_BACKEND: sqlite

  helm-lint:
    name: Helm Chart Lint & Template
    runs-on: ubuntu-latest
    # Pure client-side rendering (helm lint / helm template) — no cluster is
    # contacted, so this is safe to run on every push/PR.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.4'

      - name: Fetch chart dependencies
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build charts/isms-builder

      - name: Lint
        run: helm lint charts/isms-builder

      - name: Template — default values (bundled postgres)
        run: helm template test-default charts/isms-builder

      - name: Template — Ingress + host
        run: |
          helm template test-ingress charts/isms-builder \
            --set ingress.enabled=true --set ingress.host=isms.example.com

      - name: Template — sqlite happy path must render without DB_* wiring
        run: |
          OUT="$(helm template test-sqlite charts/isms-builder \
            --set storageBackend=sqlite --set postgresql.enabled=false)"
          if echo "$OUT" | grep -qE 'DB_PASS|DB_HOST'; then
            echo "::error::sqlite backend should not render DB_PASS/DB_HOST env vars"
            exit 1
          fi
          echo "OK: sqlite renders without DB_* env vars"

      - name: Template — in-pod TLS uses HTTPS probes
        run: |
          OUT="$(helm template test-tls charts/isms-builder \
            --set tls.inPod.enabled=true --set tls.inPod.secretName=my-tls)"
          if ! echo "$OUT" | grep -q 'scheme: HTTPS'; then
            echo "::error::tls.inPod.enabled should render HTTPS probes"
            exit 1
          fi
          echo "OK: in-pod TLS renders HTTPS probes"

      - name: Template — external database, multiple replicas
        run: |
          helm template test-external charts/isms-builder \
            --set postgresql.enabled=false --set storageBackend=postgres \
            --set replicaCount=3 \
            --set database.external.host=db.example.com \
            --set database.external.existingSecret=my-db-secret

      - name: Template — validation guard MUST reject replicaCount>1 with a file-based backend
        run: |
          if helm template test-invalid charts/isms-builder \
              --set replicaCount=3 --set storageBackend=sqlite 2>/dev/null; then
            echo "::error::_helpers.tpl validation did not trigger (replicaCount>1 + sqlite should fail to render)"
            exit 1
          fi

      - name: Template — validation guard MUST reject external DB without existingSecret
        run: |
          if helm template test-invalid-secret charts/isms-builder \
              --set postgresql.enabled=false --set storageBackend=postgres \
              --set database.external.host=db.example.com 2>/dev/null; then
            echo "::error::_helpers.tpl validation did not trigger (external DB without existingSecret should fail to render)"
            exit 1
          fi
          echo "OK: validation guard triggered as expected"

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    # Läuft nur auf main, nicht bei jedem Feature-Branch-Push
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full audit report (JSON)
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30
