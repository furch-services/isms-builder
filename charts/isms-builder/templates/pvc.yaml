{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "isms-builder.fullname" . }}-data
  labels:
    {{- include "isms-builder.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- /* Multiple replicas need to share this volume regardless of what
       persistence.accessMode says — force ReadWriteMany rather than making
       the user remember to set it (see values.yaml comment). */}}
    {{- if gt (int .Values.replicaCount) 1 }}
    - ReadWriteMany
    {{- else }}
    - {{ .Values.persistence.accessMode }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
{{- end }}
