{{- /* JWT secret: reused across `helm upgrade` via lookup so existing sessions/
   tokens aren't invalidated on every upgrade, unless the user brings their own
   via auth.jwtSecret.existingSecret. */ -}}
{{- if not .Values.auth.jwtSecret.existingSecret }}
{{- $secretName := include "isms-builder.jwtSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $jwtSecret := "" }}
{{- if $existing }}
{{- $jwtSecret = index $existing.data "JWT_SECRET" | b64dec }}
{{- else }}
{{- $jwtSecret = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "isms-builder.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ $jwtSecret | b64enc }}
---
{{- end }}

{{- /* Bundled-database credentials Secret, shared with the postgres subchart
   via postgresql.userDatabase.existingSecret (see values.yaml). Skipped when
   the user manages that secret themselves (createSecret: false) or when
   using an external database instead. */ -}}
{{- if and .Values.postgresql.enabled .Values.postgresql.createSecret }}
{{- $dbSecretName := .Values.postgresql.userDatabase.existingSecret }}
{{- $existingDb := lookup "v1" "Secret" .Release.Namespace $dbSecretName }}
{{- $dbPassword := "" }}
{{- if $existingDb }}
{{- $dbPassword = index $existingDb.data "USERDB_PASSWORD" | b64dec }}
{{- else if .Values.postgresql.generatedPassword }}
{{- $dbPassword = .Values.postgresql.generatedPassword }}
{{- else }}
{{- $dbPassword = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecretName }}
  labels:
    {{- include "isms-builder.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_DB: {{ .Values.postgresql.userDatabase.name.value | b64enc }}
  USERDB_USER: {{ .Values.postgresql.userDatabase.user.value | b64enc }}
  USERDB_PASSWORD: {{ $dbPassword | b64enc }}
---
{{- end }}

{{- if and .Values.smtp.enabled (not .Values.smtp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isms-builder.fullname" . }}-smtp
  labels:
    {{- include "isms-builder.labels" . | nindent 4 }}
type: Opaque
data:
  SMTP_USER: {{ required "smtp.enabled requires either smtp.existingSecret or SMTP_USER/SMTP_PASS values set via --set" .Values.smtp.user | b64enc }}
  SMTP_PASS: {{ required "smtp.enabled requires either smtp.existingSecret or SMTP_USER/SMTP_PASS values set via --set" .Values.smtp.pass | b64enc }}
{{- end }}
